<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
  <rect width="816" height="1056" fill="#ffffff"/>
  <rect width="816" height="390" fill="#0D2240"/>
  <rect x="0" y="390" width="816" height="12" fill="#EBB700"/>
  <text x="60" y="83" font-family="Arial,sans-serif" font-size="22" font-weight="bold" letter-spacing="3" fill="#EBB700">PORT ALLEGANY LIONS CLUB</text>
  <text x="60" y="186" font-family="Arial,sans-serif" font-size="66" font-weight="bold" fill="#ffffff">YOUR COMMUNITY.</text>
  <text x="60" y="265" font-family="Arial,sans-serif" font-size="66" font-weight="bold" fill="#FFD13E">YOUR IMPACT.</text>
  <text x="60" y="331" font-family="Arial,sans-serif" font-size="25" fill="#E3EAF3">Small acts of service. Real local connections.</text>

  <text x="60" y="476" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#0D2240">YOU DON'T HAVE TO BE A MEMBER</text>
  <text x="60" y="520" font-family="Arial,sans-serif" font-size="35" font-weight="bold" fill="#00338D">TO START HELPING.</text>

  <text x="60" y="591" font-family="Arial,sans-serif" font-size="24" fill="#344B65">Explore ways to contribute in Port Allegany:</text>
  <text x="75" y="656" font-family="Arial,sans-serif" font-size="25" fill="#0D2240">• Volunteer for community service</text>
  <text x="75" y="708" font-family="Arial,sans-serif" font-size="25" fill="#0D2240">• Share a project idea</text>
  <text x="75" y="760" font-family="Arial,sans-serif" font-size="25" fill="#0D2240">• Learn about Lions membership</text>

  <rect x="60" y="810" width="696" height="138" rx="4" fill="#00338D"/>
  <text x="88" y="865" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#EBB700">GET INVOLVED ONLINE</text>
  <text x="88" y="912" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#ffffff">port-lions.vercel.app/join</text>

  <text x="60" y="1008" font-family="Arial,sans-serif" font-size="18" fill="#52657A">Rooted in Community. Driven by Service.</text>
</svg>
